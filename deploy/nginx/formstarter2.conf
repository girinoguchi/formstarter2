# formstarterApp の既存nginx設定には一切手を加えず、別のserver blockとして追加する。
# <FORMSTARTER2_DOMAIN> は実際のサブドメイン（例: formstarter2.example.com）に置き換える。
# <APP_PORT> は formstarter2-app.service の PORT と揃える。

server {
    listen 80;
    server_name <FORMSTARTER2_DOMAIN>;

    location / {
        proxy_pass http://127.0.0.1:<APP_PORT>;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS化は certbot --nginx -d <FORMSTARTER2_DOMAIN> を実行すれば、
# certbotがこのファイルを自動的にSSL設定込みで書き換える（formstarterApp側と同じ流れ）。
